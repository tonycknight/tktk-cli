name: Build & Release

permissions: # set permissions to principle of least privilege, codeql requires read permission to the repo content and PRs (if that option is set), and must have write permissions to security events in order to push results
  actions: read
  pull-requests: write
  security-events: write
  contents: write
  checks: write

on:
  push:
  workflow_dispatch:

env:
  build-version-number: 0.1.${{ github.run_number }}  
  dotnet-version: 8.x

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run SCA
        uses: tonycknight/pkgchk-action@v1
        
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.dotnet-version }}
        
      - name: Run tests
        run: |
          dotnet tool restore
          dotnet restore
          dotnet test -c Debug -- --coverage --coverage-output-format cobertura --report-trx

      - name: Consolidate code coverage
        run: |
          dotnet reportgenerator -reports:./TestResults/*.cobertura.xml -targetdir:./publish/codecoverage -reporttypes:Html  
      
      - name: Unit test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: unit test results
          path: ${{ github.workspace }}/TestResults/*.trx
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Code coverage results
        uses: 5monkeys/cobertura-action@v14
        with:
          path: ${{ github.workspace }}/TestResults/*.cobertura.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 80
          fail_below_threshold: true
          show_line: true
          show_branch: true
          show_missing: true
          show_class_names: true
          link_missing_lines: true
          report_name: code coverage results        

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.dotnet-version }}
       
      - name: Set Build version
        if: github.ref != 'refs/heads/main'
        run: |
          echo "build-version-number=${{ env.build-version-number }}-preview" >> $GITHUB_ENV
    
      - name: Create nuget package
        run: |
          dotnet tool restore
          dotnet restore
          dotnet pack ./src/Tk.Toolkit.Cli/Tk.Toolkit.Cli.csproj -c Release -o ./package /p:PackageVersion=${{ env.build-version-number }} /p:Version=${{ env.build-version-number }} /p:AssemblyInformationalVersion=${{ env.build-version-number }} /p:ContinuousIntegrationBuild=true

      - name: Archive tool nupkg
        uses: actions/upload-artifact@v7
        with:
          name: tktk-cli.nupkg
          path: ./package/tktk*.nupkg
          
  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
  
  nuget-deploy:
    name: nuget deploy
    runs-on: ubuntu-latest
    needs:   [ sca, build, codeql, tests ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.dotnet-version }}

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: tktk-cli.nupkg
          path: ${{ github.workspace }}/artifacts

      - name: Push nuget package
        run: dotnet nuget push "artifacts/*.nupkg"  --api-key ${{ secrets.NUGET_PAT }} --source "nuget.org"

  gh-release:
    name: gh release
    runs-on: ubuntu-latest
    needs: [ nuget-deploy ]    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:    
      - uses: actions/checkout@v7

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.build-version-number }}
          prerelease: false
          generateReleaseNotes: true